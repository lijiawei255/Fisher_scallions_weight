<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <rect width="800" height="280" fill="#ffffff" rx="12"/>

  <text x="400" y="36" text-anchor="middle" font-family="Microsoft YaHei, sans-serif"
        font-size="18" font-weight="bold" fill="#0f172a">稳定判定：跳变时延迟100ms再更新</text>

  <!-- 坐标轴 -->
  <line x1="100" y1="210" x2="740" y2="210" stroke="#64748b" stroke-width="2"/>
  <line x1="100" y1="60" x2="100" y2="210" stroke="#64748b" stroke-width="2"/>
  <text x="50" y="135" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" fill="#475569">重量 (g)</text>

  <!-- 刻度 -->
  <line x1="95" y1="190" x2="100" y2="190" stroke="#64748b"/>
  <text x="88" y="194" text-anchor="end" font-family="Consolas" font-size="11" fill="#64748b">0</text>
  <line x1="95" y1="110" x2="100" y2="110" stroke="#64748b"/>
  <text x="88" y="114" text-anchor="end" font-family="Consolas" font-size="11" fill="#64748b">30</text>

  <!-- 硬件读数（蓝色）：一步跳到 30，干净无抖动 -->
  <line x1="140" y1="190" x2="280" y2="190" stroke="#0ea5e9" stroke-width="3"/>
  <line x1="280" y1="190" x2="280" y2="110" stroke="#0ea5e9" stroke-width="3"/>
  <line x1="280" y1="110" x2="480" y2="110" stroke="#0ea5e9" stroke-width="3"/>
  <text x="200" y="205" text-anchor="middle" font-family="Microsoft YaHei" font-size="11" fill="#0ea5e9">硬件：一步跳到30（已滤波）</text>

  <!-- 显示值（绿色）：延迟1个采样(100ms)后跳到30 -->
  <line x1="140" y1="190" x2="340" y2="190" stroke="#16a34a" stroke-width="3"/>
  <line x1="340" y1="190" x2="340" y2="110" stroke="#16a34a" stroke-width="3"/>
  <line x1="340" y1="110" x2="480" y2="110" stroke="#16a34a" stroke-width="3"/>
  <text x="240" y="205" text-anchor="middle" font-family="Microsoft YaHei" font-size="11" fill="#16a34a">显示：延迟100ms确认 → 跳到30</text>

  <!-- 延迟区间标注 -->
  <rect x="280" y="182" width="60" height="16" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="310" y="194" text-anchor="middle" font-family="Consolas" font-size="9" fill="#b45309">100ms</text>
  <line x1="280" y1="185" x2="280" y2="195" stroke="#f59e0b" stroke-width="1"/>
  <line x1="340" y1="185" x2="340" y2="195" stroke="#f59e0b" stroke-width="1"/>

  <!-- 物品离开场景 -->
  <line x1="480" y1="110" x2="520" y2="190" stroke="#0ea5e9" stroke-width="3"/>
  <line x1="520" y1="190" x2="660" y2="190" stroke="#0ea5e9" stroke-width="3"/>
  <line x1="480" y1="110" x2="480" y2="190" stroke="#16a34a" stroke-width="3" stroke-dasharray="4,3"/>
  <line x1="480" y1="190" x2="660" y2="190" stroke="#16a34a" stroke-width="3"/>
  <rect x="460" y="115" width="80" height="22" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="500" y="130" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" font-weight="bold" fill="#dc2626">强制归零</text>

  <!-- 说明框 -->
  <rect x="540" y="60" width="220" height="110" rx="10" fill="#f4f6fa" stroke="#e2e8f0" stroke-width="1"/>
  <text x="650" y="85" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" font-weight="bold" fill="#0f172a">工作原理</text>
  <text x="560" y="108" font-family="Microsoft YaHei" font-size="11" fill="#475569">• 硬件中值+平均滤波，读数干净</text>
  <text x="560" y="126" font-family="Microsoft YaHei" font-size="11" fill="#475569">• 跳变时：延迟1个采样(100ms)确认</text>
  <text x="560" y="144" font-family="Microsoft YaHei" font-size="11" fill="#475569">• 确认后一步更新，不显示中间值</text>
  <text x="560" y="162" font-family="Microsoft YaHei" font-size="11" fill="#475569">• 物品离开：强制归零，不显示下降</text>

  <!-- 底部说明 -->
  <rect x="100" y="225" width="640" height="30" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="420" y="245" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="bold" fill="#16a34a">效果：数字只有 0 → 30 → 0 三步变化，中间不显示任何抖动或过渡值</text>

</svg>
