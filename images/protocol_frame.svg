<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 220" width="780" height="220">
  <rect width="780" height="220" fill="#ffffff" rx="12"/>

  <text x="390" y="36" text-anchor="middle" font-family="Microsoft YaHei, sans-serif"
        font-size="18" font-weight="bold" fill="#0f172a">10 字节通信协议帧</text>

  <!-- 10个字节方块 -->
  <rect x="60" y="60" width="55" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="87" y="86" text-anchor="middle" font-family="Consolas" font-size="12" font-weight="bold" fill="#16a34a">0xAA</text>
  <text x="87" y="106" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#475569">起始字节</text>

  <rect x="118" y="60" width="55" height="60" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="145" y="86" text-anchor="middle" font-family="Consolas" font-size="12" font-weight="bold" fill="#0ea5e9">CMD</text>
  <text x="145" y="106" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#475569">命令</text>

  <rect x="176" y="60" width="55" height="60" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="203" y="86" text-anchor="middle" font-family="Consolas" font-size="12" font-weight="bold" fill="#0ea5e9">ADDR</text>
  <text x="203" y="106" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#475569">地址</text>

  <rect x="234" y="60" width="55" height="60" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="261" y="86" text-anchor="middle" font-family="Consolas" font-size="12" font-weight="bold" fill="#0ea5e9">SIGN</text>
  <text x="261" y="106" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#475569">正负号</text>

  <rect x="292" y="60" width="55" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="319" y="82" text-anchor="middle" font-family="Consolas" font-size="12" font-weight="bold" fill="#16a34a">Byte5</text>
  <text x="319" y="106" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#475569">重量高</text>

  <rect x="350" y="60" width="55" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="377" y="82" text-anchor="middle" font-family="Consolas" font-size="12" font-weight="bold" fill="#16a34a">Byte6</text>
  <text x="377" y="106" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#475569">重量中</text>

  <rect x="408" y="60" width="55" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="435" y="82" text-anchor="middle" font-family="Consolas" font-size="12" font-weight="bold" fill="#16a34a">Byte7</text>
  <text x="435" y="106" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#475569">重量低</text>

  <rect x="466" y="60" width="55" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="493" y="82" text-anchor="middle" font-family="Consolas" font-size="12" font-weight="bold" fill="#b45309">CHK_H</text>
  <text x="493" y="106" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#475569">校验高</text>

  <rect x="524" y="60" width="55" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="551" y="82" text-anchor="middle" font-family="Consolas" font-size="12" font-weight="bold" fill="#b45309">CHK_L</text>
  <text x="551" y="106" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#475569">校验低</text>

  <rect x="582" y="60" width="55" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="609" y="86" text-anchor="middle" font-family="Consolas" font-size="12" font-weight="bold" fill="#dc2626">0xFF</text>
  <text x="609" y="106" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#475569">结束字节</text>

  <!-- 重量 24 位括弧 -->
  <path d="M 288 55 Q 292 48 350 48 Q 408 48 412 55" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="350" y="44" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="bold" fill="#16a34a">24 位重量值 (3 字节)</text>

  <!-- 校验说明 -->
  <rect x="60" y="145" width="650" height="55" rx="10" fill="#f4f6fa" stroke="#e2e8f0" stroke-width="1"/>
  <text x="385" y="168" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" font-weight="bold" fill="#0f172a">校验规则：Byte2 + Byte3 + ... + Byte7 的和 = (Byte8×256 + Byte9)</text>
  <text x="385" y="188" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" fill="#475569">例如：A3 + 00 + 00 + 00 + 00 + 32 = 0xD5 → Byte8=00, Byte9=D5 ✓</text>

</svg>
