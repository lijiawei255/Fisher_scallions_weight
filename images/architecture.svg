<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260">
  <rect width="800" height="260" fill="#ffffff" rx="12"/>

  <!-- 标题 -->
  <text x="400" y="36" text-anchor="middle" font-family="Microsoft YaHei, sans-serif"
        font-size="18" font-weight="bold" fill="#0f172a">数据处理流水线</text>

  <!-- 电子秤 -->
  <rect x="40" y="80" width="130" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="105" y="110" text-anchor="middle" font-family="Microsoft YaHei" font-size="14" font-weight="bold" fill="#16a34a">电子秤</text>
  <text x="105" y="132" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" fill="#475569">CMCU-07</text>
  <text x="105" y="150" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">100ms 自动发送</text>

  <!-- 协议解析 -->
  <rect x="230" y="80" width="130" height="80" rx="12" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="295" y="110" text-anchor="middle" font-family="Microsoft YaHei" font-size="14" font-weight="bold" fill="#0ea5e9">协议解析</text>
  <text x="295" y="132" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" fill="#475569">scale_protocol</text>
  <text x="295" y="150" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">10字节帧校验</text>

  <!-- 稳定判定 -->
  <rect x="420" y="80" width="130" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="485" y="110" text-anchor="middle" font-family="Microsoft YaHei" font-size="14" font-weight="bold" fill="#16a34a">稳定判定</text>
  <text x="485" y="132" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" fill="#475569">weight_filter</text>
  <text x="485" y="150" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">连续N次波动&lt;阈值</text>

  <!-- 状态机 -->
  <rect x="610" y="80" width="130" height="80" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="675" y="110" text-anchor="middle" font-family="Microsoft YaHei" font-size="14" font-weight="bold" fill="#b45309">业务状态机</text>
  <text x="675" y="132" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" fill="#475569">weight_state</text>
  <text x="675" y="150" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">IDLE ↔ WEIGHING</text>

  <!-- 箭头 1→2 -->
  <line x1="170" y1="120" x2="225" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="197" y="110" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#64748b">串口原始字节</text>

  <!-- 箭头 2→3 -->
  <line x1="360" y1="120" x2="415" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="387" y="110" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#64748b">重量克数</text>

  <!-- 箭头 3→4 -->
  <line x1="550" y1="120" x2="605" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="577" y="110" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#64748b">稳定克数</text>

  <!-- 底部 UI 输出 -->
  <rect x="310" y="200" width="180" height="44" rx="22" fill="#16a34a" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="228" text-anchor="middle" font-family="Microsoft YaHei" font-size="15" font-weight="bold" fill="#ffffff">UI 显示（大字）</text>

  <line x1="485" y1="160" x2="400" y2="200" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <rect x="610" y="200" width="130" height="44" rx="22" fill="#b45309"/>
  <text x="675" y="228" text-anchor="middle" font-family="Microsoft YaHei" font-size="14" font-weight="bold" fill="#ffffff">累计总重 + N</text>

  <line x1="675" y1="160" x2="675" y2="198" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 箭头标记 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

</svg>
